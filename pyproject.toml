[project]
name = "jevplays"
version = "0.1.0"
description = "Jev, TypeSafe's System One model, plays Pokémon Red with a live probability dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pyboy>=2.7,<3",
    "numpy>=2.3",
    "pillow>=11",
    "starlette>=0.47",
    "uvicorn>=0.35",
    "websockets>=15",
    "typesafe-sdk>=0.7",
]

[project.scripts]
jevplays = "jevplays.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevplays"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
