name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Blink is a local agent-review tool nobody runs on a runner (see mise.toml), and a
# vendor CDN has no business standing between a push and a green build: skip its
# download rather than have a pruned pin fail `mise install` here.
env:
  MISE_DISABLE_TOOLS: http:blink
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Nothing in this job pushes; leaving the token in .git/config only widens
        # what a compromised later step could reach. fetch-depth 0 because hk's
        # gitleaks step scans commit history rather than the working tree, and a
        # shallow clone would have it report a clean scan of a single commit.
        with: {persist-credentials: false, fetch-depth: 0}
      # mise installs the uv/hk/linter versions mise.toml pins, so `hk check --all`
      # below runs the same tools as the local pre-commit hook.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with: {cache: true}
      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --all-groups
      - run: hk check --all
      # A runner has no ROM: tests/rom/ skip themselves when JEVPLAYS_ROM is unset.
      - run: uv run pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - run: docker build -t jevplays .
      - name: The image holds no game data
        run: |
          docker run --rm jevplays sh -c \
            'test ! -e /data && ! find / -xdev \( -name "*.gb" -o -name "*.gbc" -o -name "*.state" -o -name "*.ram" \) 2>/dev/null | grep .'
      - name: The emulator imports headless
        run: docker run --rm jevplays uv run python -c "import pyboy, jevplays.cli"
      - name: With no ROM it waits and says how to upload one
        run: |
          set +e
          out=$(timeout 20 docker run --rm -e JEVPLAYS_ROM=/data/rom/pokemon-red.gb jevplays 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 124 && grep -q "fly ssh sftp put" <<<"$out"
  # Deploys main to Fly once the tests and the image check pass. Off until Tyler sets the repository
  # variable FLY_DEPLOY to "true" (after the app, volume, ROM and secrets exist), so main does not
  # fail on a deploy that cannot work yet. The build runs on Fly's builder from this checkout, which
  # holds no game data; the ROM stays on the volume.
  deploy:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency: {group: deploy, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with: {version: 0.4.107}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Tell ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RESULT: ${{ job.status }}
          SHA: ${{ github.sha }}
        run: |
          Scripts/ntfy.sh "deploy ${RESULT}: ${SHA:0:7}"
